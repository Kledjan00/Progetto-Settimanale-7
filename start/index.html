<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportsHub — Eventi sportivi</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>

    <header class="bg-primary text-white text-center py-5">
      <!-- Titolo dell'app + form di ricerca -->
      <div class="container">
        <h1 class="fw-bold">SportsHub</h1>
        <p class="mb-4">Cerca una squadra, scopri prossime partite e ultimi risultati.</p>

        <!-- La ricerca parte con 'Cerca' o con Invio -->
        <div class="row justify-content-center">
          <div class="col-12 col-md-8 col-xl-6">
            <form id="form-cerca" class="d-flex gap-2">
              <input type="text" id="cerca" name="cerca" class="form-control"
                     aria-label="Nome della squadra"
                     placeholder="es. Barcellona, Lakers, Fiorentina..." required>
              <button type="submit" class="btn btn-light text-primary fw-bold px-4">Cerca</button>
            </form>
          </div>
        </div>
      </div>
    </header>

    <main class="container py-4">

      <section id="risultati-section">
        <!-- Spinner, errore, lista risultati ricerca squadre -->
        <h2 class="h4 fw-bold mb-3">Squadre trovate</h2>

        <!-- La rotellina di Bootstrap mentre aspettiamo l'API -->
        <div id="spinner" class="text-center my-3" hidden>
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Caricamento in corso...</span>
          </div>
        </div>

        <div id="errore" class="alert alert-danger" role="alert" hidden></div>

        <!-- All'avvio è vuota: le card arrivano dopo la ricerca -->
        <div id="lista-squadre" class="row g-3 justify-content-center">
          <p class="text-secondary fst-italic mb-0">Inizia cercando una squadra qui sopra.</p>
        </div>
      </section>

      <section id="dettagli-section" hidden>
        <!-- Visibile dopo click su una squadra: prossimi eventi + ultimi risultati -->
      </section>

    </main>

    <script src="script.js"></script>
  </body>
</html>
