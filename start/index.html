<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportsHub — Eventi sportivi</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>

    <header class="bg-primary text-white text-center py-5">
      <!-- Titolo dell'app + form di ricerca -->
      <div class="container">
        <h1 class="fw-bold">SportsHub</h1>
        <p class="mb-4">Cerca una squadra, scopri prossime partite e ultimi risultati.</p>

        <!-- La ricerca parte da sola mentre scrivi, oppure subito con 'Cerca' o Invio -->
        <div class="row justify-content-center">
          <div class="col-12 col-md-8 col-xl-6">
            <form id="form-cerca" class="d-flex gap-2">
              <input type="text" id="cerca" name="cerca" class="form-control"
                     aria-label="Nome della squadra"
                     placeholder="es. Barcellona, Lakers, Fiorentina..." required>
              <button type="submit" class="btn btn-light text-primary fw-bold px-4">Cerca</button>
            </form>
          </div>
        </div>
      </div>
    </header>

    <main class="container py-4">

      <!-- Filtro per sport: vale per le card della ricerca, i preferiti e l'agenda -->
      <div id="filtro-sport" class="d-flex flex-wrap justify-content-center gap-2 mb-4">
        <button type="button" class="btn btn-primary rounded-pill px-3" data-sport="Tutti">Tutti</button>
        <button type="button" class="btn btn-outline-secondary rounded-pill px-3" data-sport="Soccer">⚽ Calcio</button>
        <button type="button" class="btn btn-outline-secondary rounded-pill px-3" data-sport="Basketball">🏀 Basket</button>
        <button type="button" class="btn btn-outline-secondary rounded-pill px-3" data-sport="American Football">🏈 Football</button>
      </div>

      <section id="risultati-section">
        <!-- Spinner, errore, lista risultati ricerca squadre -->
        <h2 class="h4 fw-bold mb-3">Squadre trovate</h2>

        <!-- La rotellina di Bootstrap mentre aspettiamo l'API -->
        <div id="spinner" class="text-center my-3" hidden>
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Caricamento in corso...</span>
          </div>
        </div>

        <div id="errore" class="alert alert-danger" role="alert" hidden></div>

        <!-- All'avvio è vuota: le card arrivano dopo la ricerca -->
        <div id="lista-squadre" class="row g-3 justify-content-center">
          <p class="text-secondary fst-italic mb-0">Inizia cercando una squadra qui sopra.</p>
        </div>
      </section>

      <section id="dettagli-section" class="card border-0 shadow-sm p-4 mt-5" hidden>
        <!-- Visibile dopo click su una squadra: prossimi eventi + ultimi risultati -->

        <!-- Il nome a sinistra e il bottone dei preferiti a destra (sul telefono va sotto) -->
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
          <h2 id="nome-squadra" class="h3 fw-bold text-primary mb-0"></h2>
          <button type="button" id="btn-preferito" class="btn btn-outline-dark fw-bold"></button>
        </div>

        <!-- Su tablet e desktop le due liste stanno una accanto all'altra -->
        <div class="row g-4">
          <div class="col-12 col-md-6">
            <h3 class="h5 fw-bold pb-2 border-bottom border-2 border-primary">Prossimi eventi</h3>
            <ul id="prossimi-eventi" class="list-group list-group-flush"></ul>
          </div>

          <div class="col-12 col-md-6">
            <h3 class="h5 fw-bold pb-2 border-bottom border-2 border-primary">Ultimi risultati</h3>
            <ul id="ultimi-risultati" class="list-group list-group-flush"></ul>
          </div>
        </div>
      </section>

      <!-- Preferiti e agenda: su desktop uno accanto all'altro, sul telefono uno sotto l'altro -->
      <div class="row g-4 mt-4">
        <section id="preferiti-section" class="col-12 col-lg-8">
          <!-- Le squadre salvate: restano anche dopo aver aggiornato la pagina -->
          <h2 class="h4 fw-bold mb-3">I tuoi preferiti</h2>

          <!-- Le card le mette lo script all'avvio -->
          <div id="lista-preferiti" class="row g-3 justify-content-center"></div>
        </section>

        <section id="agenda-section" class="col-12 col-lg-4">
          <!-- Le prossime partite di tutti i preferiti, dalla più vicina -->
          <h2 class="h4 fw-bold mb-3">Prossimi appuntamenti</h2>

          <div id="spinner-agenda" class="text-center my-3" hidden>
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Caricamento in corso...</span>
            </div>
          </div>

          <!-- Se qualche squadra non si carica lo scrivo qui, le altre si vedono lo stesso -->
          <div id="errore-agenda" class="alert alert-warning" role="alert" hidden></div>

          <div class="card border-0 shadow-sm px-3">
            <ul id="agenda" class="list-group list-group-flush"></ul>
          </div>
        </section>
      </div>

    </main>

    <script src="script.js"></script>
  </body>
</html>
